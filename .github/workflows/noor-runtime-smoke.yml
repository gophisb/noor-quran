name: Noor Quran Runtime Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore offline content cache
        uses: actions/cache@v4
        with:
          path: public/offline
          key: noor-offline-${{ hashFiles('scripts/prepare-offline.mjs') }}

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 > /tmp/noor-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/noor-quran/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/noor-quran/ > /dev/null

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser runtime test
        run: npx playwright test tests/noor-runtime.spec.cjs --workers=1

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/noor-preview.log || true
