name: Extract houd11 ZIP

on:
  push:
    paths:
      - "houd11.zip"
      - ".github/workflows/extract-houd11.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f houd11.zip
          rm -rf .houd11_extract
          mkdir .houd11_extract
          unzip -q houd11.zip -d .houd11_extract

          shopt -s dotglob nullglob
          items=(.houd11_extract/*)

          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            inner="${items[0]}"
            cp -a "${inner}/." .
          else
            cp -a .houd11_extract/. .
          fi

          rm -rf .houd11_extract houd11.zip

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract houd11 project from ZIP"
          git push
