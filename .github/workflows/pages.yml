name: Deploy Noor Quran to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test ! -d dist/src
          test -f dist/manifest.webmanifest
          test -f dist/icons/icon.svg
          test -f dist/404.html
          grep -q 'src="./assets/' dist/index.html
          grep -q 'href="./manifest.webmanifest"' dist/index.html
          grep -q 'href="./icons/icon.svg"' dist/index.html
          test -f dist/.nojekyll
          wc -c dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
