name: Deploy Noor Quran to GitHub Pages
# Pages deployment guard: keep Android build untouched; this workflow only publishes dist.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore offline content cache
        uses: actions/cache@v4
        with:
          path: public/offline
          key: noor-offline-${{ hashFiles('scripts/prepare-offline.mjs') }}

      - name: Build web app
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test ! -d dist/src
          wc -c dist/index.html
          find dist -maxdepth 2 -type f | sort | head -80

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
