<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="القرآن الكريم مع تفسير السعدي، مواقيت الصلاة، الأذكار، واتجاه القبلة — في لوحة سماوية راقية" />
    <meta name="theme-color" content="#050b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <meta name="app-build" content="noor-quran-2026-09-21-pages-pwa" />
    <title>نور — القرآن الكريم وتفسير السعدي</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" style="min-height:100vh;display:grid;place-items:center;background:#050b14;color:#e9c767;font-family:Tajawal,Arial,sans-serif;padding:24px;text-align:center">
        <div>
          <div style="font-size:28px;font-weight:800">نور</div>
          <div style="margin-top:10px;color:#d9dee7">جارٍ تشغيل التطبيق…</div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const showBootError = (message) => {
          const root = document.getElementById("root");
          if (!root) return;
          root.innerHTML =
            '<div dir="rtl" style="min-height:100vh;display:grid;place-items:center;background:#050b14;color:#fff;font-family:Tajawal,Arial,sans-serif;padding:24px;text-align:center">' +
            '<div style="max-width:720px">' +
            '<div style="font-size:30px;font-weight:800;color:#e9c767">نور</div>' +
            '<div style="margin-top:14px;font-size:20px">تعذر تشغيل واجهة التطبيق</div>' +
            '<div style="margin-top:12px;color:#b9c1cc;white-space:pre-wrap;word-break:break-word;font-size:14px">' +
            String(message || "خطأ غير معروف") +
            "</div></div></div>";
        };
        window.addEventListener("error", (event) => {
          if (event?.error || event?.message) {
            showBootError(event.error?.message || event.message);
          }
        });
        window.addEventListener("unhandledrejection", (event) => {
          showBootError(event.reason?.message || String(event.reason || "Unhandled promise rejection"));
        });
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
